<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogo da EN2 — A Grande Travessia de Portugal</title>

<style>
:root{
  --bg:#111;
  --text:#eee;
  --panel:#1c1c1c;
  --accent:#ff9800;
  --grey:#555;
  --green:#2ecc71;
  --red:#e53935;
}

/* ===== ESTAÇÕES DO ANO (APENAS VISUAL) ===== */

body[data-estacao="primavera"]{
  --bg:#0f2a1c;
  --accent:#7bcf9a;
}

body[data-estacao="verao"]{
  --bg:#2a1f0f;
  --accent:#f4c430;
}

body[data-estacao="outono"]{
  --bg:#2a1a0f;
  --accent:#c76b2b;
}

body[data-estacao="inverno"]{
  --bg:#0f1a2a;
  --accent:#9ecae1;
}

#modalTitle{
  font-weight:bold;
  font-size:16px;
  margin-bottom:6px;
}

#modalText{
  font-size:15px;
  line-height:1.4;
}

#modalEffect{
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,.25);
  font-weight:bold;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, Helvetica, sans-serif;
}
h1{
  text-align:center;
  margin:20px 0;
}

/* LAYOUT PRINCIPAL */
.main{
  display:flex;
  justify-content:center;
  gap:24px;
  align-items:flex-start;
}

/* TABULEIRO */
.board-frame{
  width:1000px;
  height:750px;
  position:relative;
  overflow:hidden;
  border-radius:10px;
}
.board-img{
  position:absolute;
  inset:0;
  background:url("https://i.imgur.com/SgYhoY8.png") center/cover no-repeat;
}
.pawn{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:22px;
  pointer-events:none;
  display:none;
}

/* CONTROLOS */
.controls{
  text-align:center;
  margin:20px;
}
button{
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
}
.hidden{
  display:none;
}

/* BOTÕES PEÕES */
.car{background:#e53935;color:#fff}
.bike{background:#fb8c00;color:#fff}
.moto{background:#222;color:#fff}
.walk{background:#2ecc71;color:#000}

/* PAINEL DE OBJETIVO */
#objectivePanel{
  width:300px;
  background:var(--panel);
  border-radius:16px;
  padding:12px;
  border:2px dashed #555;
}
.objective-title{
  color:var(--accent);
  font-weight:bold;
  margin-bottom:10px;
}
.obj-item{
  display:flex;
  gap:10px;
  margin-bottom:6px;
}
.marco{
  background:var(--grey);
  color:#fff;
  padding:4px 10px;
  border-radius:8px;
  min-width:64px;
  text-align:center;
  font-weight:bold;
}
.marco.done{
  background:var(--green);
}
.extra-title{
  margin:16px 0 8px 0;
  text-align:center;
  color:#bbb;
  font-size:13px;
  border-top:1px dashed #444;
  padding-top:8px;
}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
}
#modalBox{
  background:#222;
  padding:22px;
  border-radius:14px;
  width:420px;
  text-align:center;
}
#modalBox button{margin:6px}
.accept{background:var(--green);color:#000}
.decline{background:var(--red);color:#fff}
.eventGood{
  background:#243f2f;   /* verde suave */
  color:#fff;
}

#modalEffect{
  margin-top:10px;
  margin-bottom:12px;
  font-weight:bold;
  opacity:.9;
}

#modalBox.good{
  background:#2f5a46;   /* verde mais vivo, mas suave */
}

#modalBox.bad{
  background:#6a2f2f;   /* vermelho mais limpo, menos bordeaux */
}

/* destaque subtil do OK sem mudar a cor base */
#modalBox.good button.eventGood,
#modalBox.bad  button.eventBad{
  box-shadow:0 0 0 2px rgba(255,255,255,.15);
}

.eventBad{
  background:#4a2323;   /* vermelho suave */
  color:#fff;
}

/* PÓDIO */
#podium{
  position:fixed;
  inset:0;
  background:#000c;
  display:none;
  overflow:auto;
  padding:40px;
}
.podium-box{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:30px;
  margin-bottom:40px;
}
.step{
  width:160px;
  border-radius:14px;
  text-align:center;
  padding:12px;
  color:#000;
}
.gold{background:#f5c400;height:220px}
.silver{background:#ccc;height:180px}
.bronze{background:#c68642;height:150px}
.step .emoji{font-size:30px}
.step .name{font-weight:bold;margin-top:6px}

/* CARTAS FINAIS */
.cards{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}
.card{
  background:#1c1c1c;
  border:2px dashed #555;
  border-radius:14px;
  padding:12px;
  width:260px;
}

/* CARTA DE JOGO */
.game-card{
  background:#111;
  border:1px solid #444;
  border-radius:10px;
  padding:8px;
  margin-bottom:10px;
  font-size:13px;
}
.game-card .title{
  color:var(--accent);
  font-weight:bold;
  margin-bottom:6px;
  text-align:center;
}
.game-card .line{margin-bottom:4px}

/* ESTATÍSTICAS */
.stats{
  margin-top:10px;
  font-size:13px;
  color:#ccc;
}

#rulesBtn{
  position:absolute;
  bottom:540px;
  right:20px;
  background:#c76b2b; /* laranja fogo */
  color:#111;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  z-index:10;
  box-shadow:0 4px 8px rgba(0,0,0,.4);
}

#rulesBtn:hover{
  filter:brightness(1.1);
}

</style>
</head>

/* ================= POSICIONAR PEÃO ================= */
function placePawn(pawn, i){
  const s = SPACES[i];
  let ox = -8, oy = -10;
  if(i===80){ox=-18;oy=-14}
  if(i===83){ox=-16;oy=-18}
  if(i===85){ox=-12;oy=-20}
  if(i===89){ox=-10;oy=-22}
  pawn.style.left = (s.x * board.clientWidth + ox) + "px";
  pawn.style.top  = (s.y * board.clientHeight + oy) + "px";
}

/* ================= MODAL ================= */
function showModal(a, b, c, d=""){
  // compatibilidade antiga: showModal(text, buttons)
  let title="", text="", buttons=[], effect="";

  if(Array.isArray(b)){
    text = a;
    buttons = b;
  }
  // nova versão: showModal(title, text, buttons, effect)
  else{
    title = a;
    text = b;
    buttons = c;
    effect = d;
  }

  modalTitle.textContent = title;
  modalText.textContent  = text;
  modalEffect.textContent = effect;

  modalButtons.innerHTML = "";
  modalBox.className = "";

  buttons.forEach(btnData=>{
    const btn = document.createElement("button");
    btn.textContent = btnData.text;
    btn.className = btnData.cls || "";
    btn.onclick = btnData.action;
    modalButtons.appendChild(btn);

    if(btnData.cls === "eventGood") modalBox.classList.add("good");
    if(btnData.cls === "eventBad")  modalBox.classList.add("bad");
  });

  modal.style.display = "flex";
}

function closeModal(){
  modal.style.display = "none";
}

/* ================= SETUP ================= */
startBtn.onclick = ()=>{
seasonPicker.classList.add("hidden");

rollBtn.disabled = false;
  setup.classList.add("hidden");
  names.classList.remove("hidden");

  let total = Number(playerCount.value);
  let i = 0;
  let used = [];

  function nextPlayer(){
    names.innerHTML = "";

    if(i >= total){
      const deck = [...OBJECTIVES].sort(()=>Math.random()-0.5);
      players.forEach(p=>p.objective = deck.pop());
      names.classList.add("hidden");
      game.classList.remove("hidden");
      objectivePanel.classList.remove("hidden");
      updateTurn();
      return;
    }

    const input = document.createElement("input");
    input.placeholder = "Nome do Jogador";

    names.append(
      "Jogador " + (i+1),
      document.createElement("br"),
      input,
      document.createElement("br")
    );

    [
      {id:0,cls:"car",txt:"🚗 Carro"},
      {id:1,cls:"bike",txt:"🚴 Bicicleta"},
      {id:2,cls:"moto",txt:"🏍️ Mota"},
      {id:3,cls:"walk",txt:"🚶 A pé"}
    ].forEach(p=>{
      if(used.includes(p.id)) return;

      const b = document.createElement("button");
      b.className = p.cls;
      b.textContent = p.txt;

      b.onclick = ()=>{
        used.push(p.id);
        players.push({
  name: input.value || ("Jogador "+(i+1)),
  pawn: p.id,
  pos: 0,
  done: {},
  extra: [],
  municipiosVisitados: 0,
  questionsCorrect: 0,
  questionsWrong: 0,
  finished: false,
  order: 0,

  skipTurns: 0,
  limitNextRoll: null,
  });

        pawns[p.id].style.display = "block";
        placePawn(pawns[p.id],0);
        i++;
        nextPlayer();
      };

      names.appendChild(b);
    });
  }

  nextPlayer();
};

/* ================= TURNO ================= */
function updateTurn(){
  if(players.every(p=>p.finished)){
    showPodium();
    return;
  }

  const p = players[current];

  if(p.skipTurns && p.skipTurns > 0){
  showModal(
    "🟠 Vez sem jogar",
    `${p.name} perde esta vez.`,
    [{
      text:"OK",
      cls:"decline",
      action:()=>{
        closeModal();
        p.skipTurns--;
        current = (current+1) % players.length;
        setTimeout(updateTurn, 0);
      }
    }]
  );
  return;
}

  while(players[current].finished){
    current = (current+1) % players.length;
  }

  turn.textContent = "Vez de " + players[current].name;
  renderObjective(players[current]);
}

/* ================= OBJETIVO ================= */
function renderObjective(p){
  objectivePanel.innerHTML = `<div class="objective-title">🎯 Objetivo de ${p.name}</div>`;

  if(p.objective.special){
    objectivePanel.innerHTML += `
      <div class="obj-item">
        <div class="marco">FINAL</div>
        <div>${p.objective.text}</div>
      </div>`;
  } else {
    p.objective.items.forEach(it=>{
      objectivePanel.innerHTML += `
        <div class="obj-item">
          <div class="marco ${p.done[it.km]?"done":""}">Km ${it.km}</div>
          <div>${it.text}</div>
        </div>`;
    });
  }

  if(p.extra.length){
    objectivePanel.innerHTML += `<div class="extra-title">Outras fichas</div>`;
    p.extra.forEach(km=>{
      objectivePanel.innerHTML += `
        <div class="obj-item">
          <div class="marco">Km ${km}</div>
          <div>Visitar ${MUNICIPIO_NOME[km]}</div>
        </div>`;
    });
  }
}

/* ================= PERGUNTA ================= */
function askQuestion(cell){
  const q = QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];

  showModal(
    "❓ Vamos testar o teu conhecimento da EN2",
    q.q,
    q.a.map((txt, i)=>({
      text: txt,
      cls:"accept",
      action: ()=>{
        if(i === q.c){
          players[current].questionsCorrect++;
          closeModal();
          askFicha(cell);
        } else {
          players[current].questionsWrong++;
          closeModal();
          current = (current + 1) % players.length;
          rollBtn.disabled = false;
          updateTurn();
        }
      }
    }))
  );
}

/* ================= FICHA (CORRIGIDO) ================= */
function askFicha(cell){
  const nome = MUNICIPIO_NOME[cell.km] || `Km ${cell.km}`;
const p = players[current];

// se já tem esta ficha (objetivo ou extra)
if(p.done[cell.km] || p.extra.includes(cell.km)){
  showModal(
    "📍 Ficha repetida",
    `Já tens a ficha de ${nome}. Continua a jogar.`,
    [{
      text:"OK",
      cls:"accept",
      action:()=>{
        closeModal();
        rollBtn.disabled = false;
        updateTurn();
      }
    }]
  );
  return;
}
  showModal(
    `${players[current].name} ganhou a ficha ${nome}. Aceita?`,
    [
      {
        text:"Aceitar",
        cls:"accept",
        action:()=>{
          closeModal();
          const p = players[current];
          p.municipiosVisitados++;

if(!p.objective.special && p.objective.items.some(it=>it.km===cell.km)){
  p.done[cell.km] = true;
} else {
  p.extra.push(cell.km);
}

            if(cell.final){
            p.finished = true;
            p.order = players.filter(x=>x.finished).length;
          }

          // 🔥 CONTINUA A JOGAR
          rollBtn.disabled = false;
updateTurn();
        }
      },
      {
  text:"Recusar",
  cls:"decline",
  action:()=>{
    closeModal();
    const p = players[current];

    if(cell.final){
      p.finished = true;
      p.order = players.filter(x=>x.finished).length;
    }

    current = (current + 1) % players.length;
rollBtn.disabled = false;
updateTurn();
  }
}
    ]
  );
}

function getPreviousMunicipioIndex(pos){
  const indices = Object.values(KM_TO_INDEX)
    .map(Number)
    .sort((a,b)=>a-b);

  let prev = pos;
  for(const idx of indices){
    if(idx < pos){
      prev = idx;
    } else {
      break;
    }
  }
  return prev;
}
  
function getNextMunicipioIndex(pos){
  const indices = Object.values(KM_TO_INDEX)
    .map(Number)
    .sort((a,b)=>a-b);

  for(const idx of indices){
    if(idx > pos){
      return idx;
    }
  }
  return pos;
}

/* ================= EVENTO ================= */
function getNextMunicipioIndex(pos){
  const indices = Object.values(KM_TO_INDEX)
    .map(Number)
    .sort((a,b)=>a-b);

  for(const idx of indices){
    if(idx > pos){
      return idx;
    }
  }
  return pos;
}

function doEvent(){
  const ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];

  showModal(
    ev.title,
    ev.text,
    [{
      text:"OK",
      cls:ev.cls,
      action: async ()=>{
        closeModal();

        if(ev.skip){
          players[current].skipTurns = ev.skip;
        }
        if(ev.limitNextRoll){
          players[current].limitNextRoll = ev.limitNextRoll;
        }

        const movers = ev.all ? players : [players[current]];

        for(const p of movers){
          let target = p.pos;

          if(ev.move){
            target = Math.max(0, Math.min(SPACES.length-1, p.pos + ev.move));
          }

          if(ev.goKm !== undefined){
            target = KM_TO_INDEX[ev.goKm];
          }

          if(ev.backToPreviousMunicipio){
            target = getPreviousMunicipioIndex(target);
          }

          if(ev.goNextMunicipio){
            target = getNextMunicipioIndex(target);
          }

          while(p.pos !== target){
            p.pos += p.pos < target ? 1 : -1;
            placePawn(pawns[p.pawn], p.pos);
            await new Promise(r=>setTimeout(r,200));
          }
        }

        current = (current + 1) % players.length;
rollBtn.disabled = false;
updateTurn();
      }
    }],
    ev.effect
  );
}

/* ================= JOGAR ================= */
rollBtn.onclick = async ()=>{
rollBtn.disabled = true;
  let r = Math.floor(Math.random()*6)+1;
  const p = players[current];

  if(p.limitNextRoll){
    r = Math.min(r, p.limitNextRoll);
    p.limitNextRoll = null;
  }

  dice.textContent = r;

  let target = p.pos + r;
  const LAST = SPACES.length-1;

  if(target > LAST){
  target = LAST;
}

  while(p.pos !== target){
    p.pos += p.pos < target ? 1 : -1;
    placePawn(pawns[p.pawn], p.pos);
    await new Promise(res=>setTimeout(res,300));
  }

  const idx = p.pos;
  const cell = SPECIAL_CELLS[idx];

  if(idx < 3){
  current = (current+1) % players.length;
rollBtn.disabled = false;
  updateTurn();
}
else if(cell){
  askQuestion(cell);
}
else if(idx < 85){
  doEvent();
}
else{
  current = (current+1) % players.length;
rollBtn.disabled = false;
  updateTurn();
}
 };

/* ================= PÓDIO FINAL ================= */
function showPodium(){
  podium.style.display = "block";
  game.classList.add("hidden");

  const firstObj = players.find(p=>p.objective.special && p.objective.type==="first");
  const lastObj  = players.find(p=>p.objective.special && p.objective.type==="last");
  const finished = players.filter(p=>p.finished).sort((a,b)=>a.order-b.order);

  if(firstObj && finished[0] === firstObj) firstObj.doneFinal = true;
  if(lastObj && finished[finished.length-1] === lastObj) lastObj.doneFinal = true;

  const ranked = [...players].sort((a,b)=>{
    const oa = Object.keys(a.done).length + (a.doneFinal?1:0);
    const ob = Object.keys(b.done).length + (b.doneFinal?1:0);
    if(ob!==oa) return ob-oa;
    return a.order - b.order;
  });

  podium.innerHTML = `
  <div class="podium-box">
    ${ranked[1]?`<div class="step silver"><div class="emoji">${pawns[ranked[1].pawn].textContent}</div><div class="name">${ranked[1].name}</div></div>`:""}
    <div class="step gold"><div class="emoji">${pawns[ranked[0].pawn].textContent}</div><div class="name">${ranked[0].name}</div></div>
    ${ranked[2]?`<div class="step bronze"><div class="emoji">${pawns[ranked[2].pawn].textContent}</div><div class="name">${ranked[2].name}</div></div>`:""}
  </div>

  <div class="cards">
  ${ranked.map(p=>`
    <div class="card">
      <div class="objective-title">🎴 Carta de Jogo — ${p.name}</div>

      ${
        p.objective.special
        ? `<div class="obj-item">
            <div class="marco ${p.doneFinal?"done":""}">FINAL</div>
            <div>${p.objective.text}</div>
          </div>`
        : p.objective.items.map(it=>`
            <div class="obj-item">
              <div class="marco ${p.done[it.km]?"done":""}">Km ${it.km}</div>
              <div>${it.text}</div>
            </div>`).join("")
      }

      ${p.extra.length?`<div class="extra-title">Outras fichas</div>`:""}
      ${p.extra.map(km=>`
        <div class="obj-item">
          <div class="marco">Km ${km}</div>
          <div>Visitar ${MUNICIPIO_NOME[km]}</div>
        </div>`).join("")}

      <div class="stats">
        🏘️ Municípios: ${p.municipiosVisitados}<br>
        ❓ Certas: ${p.questionsCorrect}<br>
        ❌ Erradas: ${p.questionsWrong}
      </div>
    </div>
  `).join("")}
  </div>`;
}
